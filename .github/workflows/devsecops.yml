name: DevSecOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: devsecops-website

jobs:
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

  docker-build:
    name: Docker Build
    needs: trivy-fs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t "${IMAGE_NAME}:${GITHUB_SHA}" .

  trivy-image:
    name: Trivy Docker Scan
    needs: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Image
        run: docker build -t "${IMAGE_NAME}:${GITHUB_SHA}" .

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-website:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1

  terraform:
    name: Terraform
    needs: trivy-image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Format
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -input=false

  ansible:
    name: Ansible Validation
    needs: terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ansible
        run: python3 -m pip install ansible

      - name: Ansible Syntax Check
        run: ansible-playbook --syntax-check ansible/deploy.yml

  kubernetes:
    name: Kubernetes Validation
    needs: ansible
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate manifests
        run: kubectl apply --dry-run=client -f k8s/

  helm:
    name: Helm Validation
    needs: kubernetes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm Lint
        run: helm lint helm/devsecops-website

      - name: Helm Template
        run: helm template devsecops-website helm/devsecops-website

  deploy:
    name: Deploy Application
    needs: [helm, kubernetes]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deployment placeholder
        run: echo "Configure cluster credentials and replace this step with the Helm deployment command."